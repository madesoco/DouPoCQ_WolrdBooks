---
变量更新规则:
  世界状态:
    时间:
      format: ${纪元/时期}-${年}-${月}-${日}-${时段}
      check:
        - 每次剧情推进、行动、修炼、休息或旅行后更新，保持时间流逝合理
        - 若时间跨度较大（如闭关），应说明跳跃原因
    位置:
      format: ${大区域/大陆}-${中地区/势力}-${小地点/地标}-${详细位置}
      check:
        - 随主角移动实时变更，层级从大到小排列

  主角:
    基本信息.${姓名|性别|种族|身份|外貌|背景}:
      check:
        - 初始化时填写，不得为空
        - 当遭遇重大变故、易容伪装、获取新身份或体质蜕变时更新

    斗气修炼.斗气境界:
      check:
        - 随日常修炼、战斗感悟、服用丹药或吸收天材地宝后更新
        - 格式必须包含具体星级或小段（如：斗师三星、斗宗八星、半圣高级、斗圣四星后期），除斗之气使用段位（如：斗之气七段）
        - 满足突破条件时提升，严格参考《斗气等级体系》战力基准与星级设定
    斗气修炼.修炼进度:
      type: number
      range: 0~100
      check:
        - 随着修炼、战斗、服用丹药增加
        - 达到100时清零并触发境界突破判定

    灵魂力.灵魂境界:
      check:
        - 随冥想、炼药、吸收灵魂本源等行为提升
        - 格式必须包含具体小段（如：凡境初期、灵境巅峰、天境大圆满）
        - 满足条件时更新，严格参考《灵魂力境界设定》
    灵魂力.凝聚进度:
      type: number
      range: 0~100
      check:
        - 随冥想、炼药、吸收灵魂本源等行为增加
        - 到达100时清零并触发小境界自动突破或大境界突破判定

    炼药术.炼药师等级:
      check:
        - 成功炼制对应品级丹药并获得认证后更新，仅增加不减少（如：三品、七品高级、八品五色丹雷）
    炼药术.熟练度:
      type: number
      range: 0~10000
      check:
        - 随成功炼制丹药或控火练习增加

    异火状态:
      type: |-
        {
          [异火名: string]: {
            标签: string; // 固定包含 [异火] 及异火榜位置，如 [异火][异火榜第十九]
            描述: string;
            效果: object;
          }
        }
      check:
        - 成功降服并吸收入体后添加

    当前状态:
      type: |-
        {
          [状态名称: string]: {
            类型: string;
            描述: string;
            效果: object;
            结束时间: string;
          }
        }
      check:
        - 遭遇中毒、受伤、秘法反噬或获得临时增益时添加
        - 到达结束时间或被化解后移除

    技能与能力:
      type: |-
        {
          [技能名称: string]: {
            类型: string; // 仅限: 斗技/功法/秘法/特殊能力 四选一
            标签: string; // 无限制，多个并列保留数组格式如 [主动技][玄阶中级]；血脉、体质禁止分级
            描述: string;
            效果: object;
          }
        }
      check:
        - 学习新技能、更换功法或获取特殊能力时更新

    装备信息:
      type: |-
        {
          [装备名称: string]: {
            类型: string; // 仅限: 武器/防具/饰品/药鼎
            标签: string; // 必须保留[]符号，如 [长剑]
            描述: string;
            效果: object;
          }
        }
      check:
        - 获取、损毁、更替装备或更换药鼎时更新

    物品栏:
      type: |-
        {
          [物品名称: string]: {
            类型: string; // 主要类别，如: 丹药/货币/书籍/药材/魔核等
            标签: string; // 必须保留[]符号，如 [消耗品]
            描述: string;
            效果: object;
          }
        }
      check:
        - 获取、消耗、出售或丢弃物品时更新
        - 物品耗尽时直接移除

  任务契约:
    type: |-
      {
        [任务名: string]: string; // 任务详情说明
      }
    check:
      - 接取新任务、签订契约或状态改变时更新
      - 任务完成或契约解除后移除

  关系列表:
    type: |-
      {
        [NPC名称: string]: {
          基本信息: {
            姓名: string; 性别: string; 种族: string;
            身份: string; 外貌: string; 背景: string;
            与主角关系: string;
          };
          修炼与状态: {
            斗气境界: string; 灵魂境界: string; 炼药术等级: string;
            已吸收异火: { [异火名: string]: { 标签: string; 描述: string; 效果: object; } };
            当前状态: { [状态名称: string]: { 类型: string; 描述: string; 效果: object; 结束时间: string; } };
          };
          技能与能力: {
            [技能名称: string]: { 类型: string; 标签: string; 描述: string; 效果: object; }
          };
          装备信息: {
            [装备名称: string]: { 类型: string; 标签: string; 描述: string; 效果: object; }
          };
          物品栏: {
            [物品名称: string]: { 类型: string; 标签: string; 描述: string; 效果: object; }
          };
        }
      }
    check:
      - 新NPC与主角产生实质交集时添加完整结构
      - NPC死亡或彻底退场时移除

    "${NPC名称}":
      基本信息.与主角关系:
        check:
          - 根据剧情互动结果、利益纠葛和态度变化实时调整
      基本信息.${姓名|性别|种族|身份|外貌|背景}:
        check:
          - 仅当重大变故、易容、新身份或体质蜕变时更新
      修炼与状态.斗气境界:
        check:
          - 满足突破条件时提升，参考斗气等级战力基准
          - 格式包含具体星级或小段（如：斗皇三星、斗尊巅峰）
      修炼与状态.灵魂境界:
        check:
          - 满足突破条件时提升，参考灵魂力境界设定
          - 格式包含具体小段（如：灵境初期）
      修炼与状态.炼药术等级:
        check:
          - 满足炼药师品级要求时更新
      修炼与状态.已吸收异火:
        check:
          - 获取异火时更新
      修炼与状态.当前状态:
        check:
          - 记录NPC即时的增益减益或特殊状态
      技能与能力:
        check:
          - 获取新技能时更新；遵循主角同名字段格式规则
      装备信息:
        check:
          - 获取或更替装备时更新；遵循主角同名字段格式规则
      物品栏:
        check:
          - 物品变动时更新；遵循主角同名字段格式规则
