---
势力地理索引:
  西北区域:
    概览: 大陆西北边陲，多国毗邻，沙漠、山脉与帝国城邦并存
    地区:
      加玛帝国:
        概览: 西北边陲的中等帝国，皇室统治，云岚宗为境内最强宗门
        地点: 乌坦城、加玛圣城、云岚山、黑岩城、盐城
      魔兽山脉:
        概览: 加玛西部的自然区域，以魔兽领地划分地盘，人类活动集中在外围
        地点: 青山镇
      塔戈尔大沙漠:
        概览: 加玛西部的大型沙漠，绿洲分散，蛇人族活动于此
        地点: 石漠城、蛇人族部落
      出云帝国: 接壤加玛东境，以毒功修行者闻名
      落雁帝国: 加玛东北方向，落雁宗在境内势力显著
      慕兰帝国: 加玛东南方向，慕兰谷在境内势力显著
      天蛇帝国: 加玛北部帝国，天蛇府统治区域

  黑角域:
    概览: 中州与西北区域交界地带，无统一政权，各方势力割据，通货以劫掠与黑市交易为主
    地点:
      迦南学院: 大陆知名学院，位于黑角域中部，设有外院与内院，执法队维持学院周边秩序
      黑皇城: 黑角域中部偏北的城池，黑皇宗控制
      黑印城: 黑角域南部城池，八扇门定期举办大型拍卖会
      魔炎山脉: 黑角域西部山脉，主峰为魔炎谷驻地
      暮之城: 黑角域西部城池，血宗活动于此
      黑骷城: 黑角域西北部城池，黑骷墓活动于此
      焱城: 黑角域东部城池，毗邻中州边境，地炎宗活动于此
      黑域大平原: 黑风暴频发的外围荒原

  中州:
    概览: 大陆中部，地势平坦，人口众多，势力众多的繁荣区域
    地区:
      圣丹城: 中州腹地大型城池，丹塔所在地，炼药师活动集中
      天星山脉: 腹地山脉，星陨阁驻地所在
      万花谷: 南部山谷，花宗驻地
      天冥宗山门: 南部的天冥宗驻地
      炙火山脉: 西南的火山山脉，焚炎谷驻地
      冰河谷: 北部冰原中的山谷，冰河谷驻地
      黄泉山脉: 北部的黄泉阁驻地
      风雷山脉: 北域山脉，常年受风雷影响，风雷阁驻地
      万剑山: 西部山峰，万剑阁驻地
      莽荒古域: 东北边境毒虫密布、遗迹留存的远古森林
      回声谷: 南部隐世宗门音谷所在

  兽域:
    概述: 中州最南端区域，十万大山连绵，魔兽种族栖居地，遵循血脉威压与领地法则
    地区:
      万兽原: 兽域外围与中部的过渡平原，各族群争夺水源与地盘
      骸骨山脉: 远古魔兽骸骨堆积的山脉，阴寒毒物出没
      黄泉山脉: 阴寒山脉，地下空间广阔，九幽地冥蟒族栖居于此
      梧桐巨木: 兽域南部的巨型梧桐，天妖凰族栖居于此
      十万大山: 位于最南端毒瘴弥漫的连绵深山，人族少有涉足

  特殊区域:
    八族入口:
      古圣城: 中州东域，古族入口，由黑湮军精锐把守
      药帝城: 中州极南地带，药族入口，仅限族人与受邀宗师入城
      炎圣城: 中州西炙火山脉深处，炎族入口，由炎族裔民世代守卫
      惊雷城: 中州东北雷渊山脉，雷族入口，城池终年雷云笼罩
      巨石城: 中州西北荒芜石原，石族入口，巨石堆砌，阵法加持
      幻灵城: 中州北部灵山泽中，灵族入口，地势隐蔽，常年起雾
    四大龙岛: 太虚古龙驻地，非族人难以发现，处于内部争斗状态
