---
地域-西北地域:
  定位: 斗气大陆西北边陲，多国、宗门与边境区域并存。
  环境: 沙漠、山脉、帝国城邦和荒野交错，人口与强者密度整体低于中州。
  格局: 帝国负责名义统治，宗门、商会、学院、佣兵团和黑市势力共同影响地方局势。
  特征: 跨国旅行通常依赖商路、商队、佣兵护送或熟悉地形的强者带路；沙漠、山脉和势力边界会显著提高通行风险。
  资源: 帝国贸易、炼药师渠道、沙漠药材、魔兽材料、矿脉、宗门传承和边境情报。
  风险: 国与国之间的边境摩擦、宗门争斗、资源争夺、魔兽活动、蛇人族冲突以及黑市势力介入。
  地区:
    加玛帝国: 西北边陲的中等帝国，皇室、云岚宗和商会共同影响地方秩序，西部由魔兽山脉与塔戈尔大沙漠构成边境。
    魔兽山脉: 加玛帝国西部的自然区域，纵贯加玛西部，以魔兽领地划分地盘，人类活动集中在外围。
    塔戈尔大沙漠: 加玛帝国西部的大型沙漠，绿洲分散，蛇人族活动于此。
    出云帝国: 与加玛帝国接壤，以毒功修行者和毒师势力闻名。
    落雁帝国: 加玛帝国东北方向，落雁宗在境内势力显著。
    慕兰帝国: 加玛帝国东南方向，慕兰谷在境内势力显著。
    天蛇帝国: 加玛帝国北部帝国，天蛇府统治区域。
