---
地点-黑岩城:
  定位: 加玛帝国西部的大型城市，通往塔戈尔大沙漠方向的途经要地，炼药师公会分会、药材交易和飞行运输体系在此集中
  环境: 城区围绕炼药师公会、药材坊市、商路和飞行运输场展开，炼药师、药材商、商队与各地修炼者往来密集，城市秩序主要依托公会与地方管理维持
  主要场所:
    炼药师公会分会: 负责炼药师认证、考核、药材鉴定和丹药交易，是帝国东部重要的炼药师身份与资源渠道
    炼药师坊市: 聚集药材商、炼药师和修炼者，公开交易常见药材、丹药与炼药材料；稀有物品通常需要熟人或等价交换
    飞行运输场: 经营前往帝国边境和其他城市的飞行运输，承担人员、药材与货物的长途转运
    私人收藏交易处: 城内收藏家收集稀有药材和特殊资源，交易条件与库存不固定，适合通过委托或交换寻找难得物品
  主要人物:
    奥托: 黑岩城炼药师公会的重要炼药师，主持公会事务、炼药交流和考核相关工作
    弗兰克: 黑岩城炼药师公会会长之一，负责公会管理、炼药师认证和重大考核裁定
  NPC速览:
    雪魅: 弗兰克的弟子，年轻炼药师，性格冷静
    琳菲: 奥托的弟子，年轻炼药师，性格活泼好胜
    古特: 活动于黑岩城的收藏家与炼药师，拥有私人收藏和特殊资源交易渠道，性格古怪，重视等价交换
  原著机缘: 古特的私人收藏中存有冰灵寒泉，可辅助抵御异火炼化时的高温与伤害；通常需要以伴生紫晶源等稀有火属性资源交换
  层级上限: 城内可能接触到斗灵级强者，炼药师体系与公开交易渠道通常可达四品。