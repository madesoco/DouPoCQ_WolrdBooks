---
地点-乌坦城:
  定位: 加玛帝国西部的中型城池，萧家、加列家与奥巴家相互竞争，是萧家故事的起点
  环境: 城池连接帝国商路与魔兽山脉外围，城区由家族府邸、商业街、拍卖场、普通居民区和通往山脉的道路组成。
  主要场所:
    米特尔拍卖场: 进行商品拍卖、稀有资源交易与情报交换，由米特尔家族分会管理，重要交易需要身份、财力或中间人引荐；雅妃负责主要拍卖事务，谷尼负责丹药鉴定。
    乌坦城坊市: 各方修炼者和商贩交易药材、斗技、武器与修炼资源的场所
    萧家府邸: 萧家族人、产业和日常事务的中心，包含家族大厅、演武场、斗气阁和后山等区域，外人进入需要通报。
    魔兽山脉入口: 佣兵、采药人和冒险者出入的区域，可获取药材与魔兽材料，但存在魔兽、黑吃黑和家族争夺。
  主要人物:
    萧战: 萧家族长，乌坦城三大家族之一的实际掌权者，负责维持萧家产业与家族地位。
    萧炎: 萧家少族长，正处于修炼低谷，是乌坦城早期家族冲突与后续变局的核心人物。
    萧薰儿: 寄居萧家的神秘少女，萧炎最坚定的支持者，实力和真实背景远高于表面身份。
    雅妃: 米特尔拍卖场负责人，掌握拍卖、交易和城内情报渠道，擅长在家族之间周旋。
    药老: 随萧炎常驻于黑色古戒中的神秘灵魂，通常不以公开身份活动，是萧炎修炼与炼药的幕后指导者。    
  NPC速览:
    加列毕: 加列家族族长，乌坦城商业竞争的主要推动者之一
    奥巴帕: 奥巴家族族长，参与三大家族之间的资源与地盘竞争
    谷尼: 米特尔拍卖场二品炼药师
    萧家子弟: 萧玉、萧宁、萧媚等
  层级上限: 最高大斗师；最高接触到二品级别丹药
