---
地点-蛇人族聚居地:
  定位: 塔戈尔大沙漠深处的蛇人族城市、部落与绿洲聚居区，是蛇人族统治、驻军和资源调配的核心地带。
  环境: 聚居地围绕绿洲水源、石质建筑与地下通道形成，与外围沙海之间由巡猎范围和天然风沙隔开；人类商路无法直接抵达。
  主要场所:
    女王居所与议事区: 美杜莎女王处理族内统治、领地调度与对外决断的核心区域，外族不得擅入。
    绿洲聚居区: 蛇人族的主要生活与补给区域，水源、储藏与居住设施集中于此。
    沙漠巡猎通道: 连接王城、外围部落和人类边境方向的行动路线，由蛇人族战士巡查。
  主要人物:
    美杜莎女王: 蛇人族女王与最高统治者，掌控塔戈尔大沙漠深处领地，对人类越境活动保持强硬态度。
  NPC速览:
    月媚: 蛇人族强者，负责蛇人族对外巡查和人类入侵者的处置。
  层级上限: 聚居地可出现斗宗级强者；族内以蛇类魔核、毒材与火土属性资源为主，没有稳定对外开放的高阶炼药渠道。
