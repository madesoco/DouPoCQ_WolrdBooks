---
地区-塔戈尔大沙漠:
  定位: 加玛帝国境内的大型荒漠地区，蛇人族主要领地与人类边境城镇之间的缓冲地带。
  环境: 常年炎热干旱，昼夜温差大，风沙、流沙与缺水会迅速耗尽旅者体力；火、土属性能量较为活跃，地下分布有岩层、熔岩洞穴和零散绿洲。
  格局: 人类城镇集中在沙漠边缘与商道节点，依靠补给、地图、佣兵与商队维持往来；越过边缘地带即进入蛇人族巡猎和聚居范围，深处缺乏稳定的人类据点。
  主要势力:
    蛇人族: 塔戈尔大沙漠的主导族群，占据深处绿洲与聚居地；以美杜莎女王为最高统治者，人类贸然深入其领地会被视为入侵。
    加玛帝国边境城镇: 漠城、石漠城等人类城镇负责物资集散、商道与边境预警，难以直接控制沙漠深处。
    漠铁佣兵团: 以石漠城为据点的佣兵团，由萧鼎、萧厉统领，在沙漠边缘承接护送、采集与情报生意。
  资源: 沙漠药材、蛇类魔核与毒材、火土属性矿物、绿洲水源，以及人类城镇流通的地图、补给和佣兵委托。
  风险: 极端气候与迷路、蛇类魔兽、蛇人族巡猎队、边境冲突；深入地下遗迹或熔岩区域时，还可能遭遇高阶蛇类魔兽与火属性危险。
  原著机缘: 青莲地心火，异火榜第十九，位于沙漠深处地下岩浆地穴的青莲台上，由双头火灵蛇守护；地穴入口隐蔽，熔岩与高温会阻碍普通人深入。
  下属地点:
    漠城: 沙漠边缘的人类补给城，地图与入漠物资的集散点。
    石漠城: 邻近沙漠的佣兵城市，漠铁佣兵团据点所在。
    蛇人族聚居地: 沙漠深处的蛇人族领地与绿洲聚居区域，外人不可擅入。
  层级上限: 最高可出现斗宗级强者与六品炼药师；人类边缘城镇本地流通的炼药与修炼资源仍以低中阶为主。
