---
地点-盐城:
  定位: 加玛帝国东部的重要城市，墨家经营于此，家族势力、佣兵和地方商路共同影响城内秩序。
  环境: 城区以墨家府邸、家族产业、佣兵活动区和通往周边城市的商路为主；地方势力色彩浓厚，外来者通常需要通过家族、商会或佣兵渠道行动。
  主要场所:
    墨家府邸: 墨家处理家族事务、接待外来势力和调动护卫的核心据点，内部区域按家族身份与事务权限划分。
    家族产业区: 分布墨家经营的商铺、仓储和护卫设施，负责地方交易、物资调度与佣兵雇用。
    佣兵集市: 交易药材、魔兽材料、武器和护送服务，也是地方佣兵与家族势力交换情报的场所。
    城外商路: 连接帝国东部各城与周边荒野，能够通往更偏远的遗迹、魔兽活动地和资源产区，但路线信息并不完全公开。
  主要人物:
    墨承: 墨家长老，坐镇盐城并掌握家族的武力、护卫和对外扩张事务。
  层级上限: 城内本地势力最高通常至斗灵级，炼药师与丹药渠道通常不超过三品。
