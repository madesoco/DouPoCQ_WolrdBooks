---
地点-青山镇:
  定位: 加玛帝国西部、魔兽山脉外围的佣兵小镇，是采药、护送和药材交易的前沿集散地。
  环境: 城镇依山脉入口展开，街区以佣兵驻地、药材店、医疗场所、旅店和补给商铺为主；进山道路集中，外来修炼者流动频繁。
  主要场所:
    万药斋: 青山镇的药材店与医疗场所，负责收购药材、治伤和组织采药队；小医仙在此任职，药材中偶尔会混有尚未鉴定的稀有品种。
    佣兵集市与任务区: 发布护送、采药、猎取魔兽材料等委托，佣兵团、药材商和进山队伍在此交换消息与补给。
    狼头佣兵团驻地: 三大佣兵团之一的固定据点，负责山脉行动、佣兵招募和镇内地盘事务。
    魔兽山脉进山口: 连接外围采集路线的通道，向内可通往更危险的峡谷、洞穴和未标记区域。
  主要人物:
    小医仙: 万药斋医师，熟悉采药、治伤和毒药配置，是镇内佣兵反复接触的医师与药材顾问。
    穆蛇: 狼头佣兵团团长，经营青山镇及外围山脉的佣兵、护卫和资源渠道。
  NPC速览:
    穆力: 狼头佣兵团少团长，在镇内负责招募、交涉和山脉行动。
    赫蒙: 狼头佣兵团三团长，负责带队进山和处理高风险佣兵任务。
    甘慕: 狼头佣兵团高阶佣兵，常参与山脉巡查、追踪和武力事务。
  原著机缘: 万药斋存有伪装成黄莲精的血莲精，是炼制血莲丹的主材料；物品外观容易与普通药材混淆。
  层级上限: 本地活动最高常见为大斗师级，炼药师与丹药交易通常不超过三品。
