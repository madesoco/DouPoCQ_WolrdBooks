---
地点-云岚山:
  定位: 加玛帝都城外的高山，云岚宗山门所在，也是加玛帝国最重要的宗门据点之一；山体本身属于自然地理，山上的宫殿、道路与禁地由云岚宗经营。
  环境: 山势陡峭，云雾与强风常年环绕，登山道路和飞行路线都受云岚宗控制。
  门派格局:
    外门区: 位于山腰及山门附近，集中外门弟子、低阶执事和日常杂役；外来者通常只能活动到这一层。
    内门与长老区: 位于山势较高处，供内门弟子、亲传弟子、执事和长老活动；进入需要宗门身份或核心人物引荐。
    宗主核心区: 以宗主大殿及其周边建筑为中心，供宗主、少宗主及获准长老活动。
    后山禁区: 位于山门体系最深处，包含生死门和高阶闭关区域，与日常弟子活动区隔离；进入需要宗门高层许可或闭关资格。
  主要场所:
    山门与登山道: 云岚宗对外接待、身份核验和进出管控的入口；普通访客需要通报或得到宗门许可，强行登山会被视为挑衅。
    云岚宗广场: 山顶举行宗门集会、弟子考核和公开比试的场所，能够容纳大量弟子，也是宗门对外展示实力的主要场面。
    宗主大殿: 宗主处理宗门事务、接见来客和召集长老的核心建筑，涉及宗门决策、外部交涉或重大争议时通常在此处进行。
    山脚军营与警戒线: 加玛皇室在云岚山周边保持的军事存在，用于监视和制衡云岚宗；军营不等同于云岚宗辖区，双方保持名义上的边界。
  主要人物:
    云韵: 云岚宗宗主，坐镇云岚山，负责宗门对外声誉、弟子培养和与帝国其他势力的交涉。
    云棱: 云岚宗大长老，主持内门事务、弟子晋升和宗门执法，是宗主之外最具日常权力的高层之一。
    云山: 云岚宗前任宗主，闭关于生死门，是云岚宗隐于宗门制度之下的最高层战力。
    纳兰嫣然: 云韵亲传弟子与云岚宗少宗主，在山上修炼、接受宗门传承和参与内门事务。
    古河: 加玛帝国六品炼药师与丹王，受云岚宗礼遇并驻宗活动，为宗门提供高阶炼药、丹药鉴定和外部炼药师关系渠道。
  NPC速览:
    葛叶: 云岚宗负责对外事务的长老，负责弟子带队，常在山门、宗主大殿和帝国各地之间往来；可作为宗门交涉、传令和调查事务的直接接触人。
  层级上限: 云岚山常规活动可接触斗皇级宗主与斗王长老，生死门等核心区域存在斗宗级强者；炼药师最高可接触六品炼药师，宗门自有药材与丹药渠道通常不超过五品。
