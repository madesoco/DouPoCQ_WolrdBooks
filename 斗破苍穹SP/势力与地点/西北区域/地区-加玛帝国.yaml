---
地区-加玛帝国:
  定位: 西北地域边陲中等帝国，皇室、云岚宗与商会共同影响国家秩序。
  格局: 帝国核心为加玛圣城及其周边区域，西部连接乌坦城、魔兽山脉和塔戈尔大沙漠，主要城市沿商路分布。
  结构: 皇室掌握名义上的国家统治，云岚宗拥有最强宗门影响力，米特尔商会控制重要商业渠道，炼药师公会维持炼药师体系与行业秩序。
  主要势力:
    皇室与军方: 维持帝国名义上的统治和对外秩序，控制都城、军队与主要行政资源。
    云岚宗: 加玛帝国境内最强宗门，控制云岚山及大量修炼资源，对地方家族和帝国事务拥有强大影响力。
    米特尔商会: 掌握拍卖会、商路和跨城交易网络，在各大城市设有分会。
    炼药师公会: 负责炼药师认证、丹药交易与行业秩序，是帝国重要的技术和资源渠道。
    蛇人族: 主要活动于塔戈尔大沙漠，与帝国西部边境长期存在资源和领地冲突。
  地区规则: 城镇通常受帝国律法约束，但宗门、大家族和商会在地方事务中拥有较强话语权；外来者需要遵守当地势力的地盘规则。
  资源: 炼药师公会渠道、拍卖会、边境药材、矿脉、商会情报、家族产业和宗门传承。
  风险: 宗门与家族之间的利益冲突、地方商业战升级、边境摩擦、蛇人族冲突以及高阶强者对地方事务的干涉。
  地点:
    乌坦城: 帝国西部边境城池，本地家族与商会聚集
    加玛圣城: 加玛帝国政治与炼药师活动中心
    云岚山: 圣城郊外的高山，云岚宗山门所在
    黑岩城: 帝国西部城市，通往塔戈尔大沙漠方向的途经要地，设有炼药师公会分会与商会据点
    盐城: 帝国境内城市，墨家驻地，墨家在当地势力深厚