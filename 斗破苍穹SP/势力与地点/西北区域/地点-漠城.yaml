---
地点-漠城:
  定位: 塔戈尔大沙漠边缘的人类城镇，进入沙漠前采购地图、补给与向导信息的前沿落脚点
  环境: 城市依靠外来商队和沙漠行者维持，城区以商铺、客栈、补给摊位和通向沙漠的出入口为主；离城后很快进入高温、风沙和缺水环境
  主要场所:
    古图地图店: 城内的旧地图店，店主古图收集、修补和出售沙漠地图，掌握少见的旧图资料
    入漠商路: 连接城市与沙漠的主要道路，商队和冒险者在此补充水源、坐骑与防沙装备后出发
    城内集市: 集中交易药材、魔核、干粮、水囊和沙漠行装，亦可雇佣向导或获得路线消息
  主要人物:
    海波东: 化名古图经营地图店的冰属性斗皇，因美杜莎女王的封印而隐居于漠城，真实身份未对外公开
  原著机缘: 古图地图店的妖火残图
  层级上限: 城中隐有斗皇级强者；常规交易以中低阶物资为主，炼药与丹药渠道通常不超过三品。
