---
地点-石漠城:
  定位: 塔戈尔大沙漠人类一侧边缘的沙漠城市，人类商路、佣兵活动和沙漠补给在此交汇。
  环境: 城市依靠城墙、商路和水源维持聚落，城区以佣兵驻地、补给商铺、药材交易和通往沙漠的道路为主；离城越远，炎热、缺水和蛇人活动带来的压力越明显。
  主要场所:
    漠铁佣兵团驻地: 城中佣兵据点，负责招募佣兵、护送商队、侦察沙漠和处理蛇人活动；萧鼎、萧厉在此经营。
    城门与沙漠商路: 人员、商队和佣兵进出沙漠的主要通道，承担地图、向导、坐骑和补给交换。
    佣兵集市: 交易沙漠药材、魔核、武器和护具，也是各佣兵团交换情报与接取任务的场所。
    城外沙漠边缘: 连接绿洲、遗迹和蛇人活动范围的开阔地带，路线选择与补给准备会直接影响进出安全。
  主要人物:
    萧鼎: 漠铁佣兵团团长，主持驻地、佣兵招募、商路护送和对外交涉。
    萧厉: 漠铁佣兵团核心成员，负责战斗、巡查和处理沙漠边缘的武力事务。
  NPC速览:
    青鳞: 漠铁佣兵团收留的蛇人混血少女，在驻地处理杂务；天生碧蛇三花瞳，对蛇类魔兽具有特殊感知与控制能力。
  层级上限: 城内常驻与活动强者通常至大斗师级，炼药师和丹药交易渠道通常不超过三品。
