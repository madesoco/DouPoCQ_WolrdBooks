---
地点-加玛圣城:
  定位: 加玛帝国的帝都与政治中心，也是帝国皇室、炼药师公会总部、米特尔家族总部和主要贵族家族的聚集地；城内秩序稳定，但各方势力彼此制衡。
  环境: 城池规模和繁华程度远胜普通边境城市，城区围绕皇宫、家族府邸、炼药师公会、商会、坊市和公共街道展开
  主要场所:
    皇宫与皇室区域: 加玛皇室处理政务、接见贵族和调动军政资源的中心，守卫严密，外来者通常需要正式身份或皇室许可才能进入核心区域。
    炼药师公会总部: 负责炼药师认证、丹药交易、药材鉴定和炼药师纠纷处理，是帝国最重要的炼药资源与专业权威所在地；非炼药师也可以通过交易或委托接触其外围服务。
    米特尔家族总部: 米特尔家族管理帝国商路、拍卖和贵重资源交易的核心据点，常有商人、贵族与各地势力前来洽谈。
    帝都坊市与商街: 汇集药材、丹药、斗技、武器、魔兽材料和日常商品的交易区域，既有正规商铺，也有依靠熟人和中间人维持的隐秘交易。
    贵族家族府邸区: 纳兰家族、木家等帝国权贵家族的居所和产业集中区域，家族之间通过婚姻、军政关系、商业往来和强者支持维持影响力。
  主要人物:
    加刑天: 加玛皇室守护者与帝国顶尖强者，坐镇帝都，负责维持皇室安全和帝国高层势力之间的平衡。
    法犸: 炼药师公会会长，帝国炼药师体系的最高负责人之一，负责炼药师认证、丹药交易和重大炼药事务。
    米特尔·腾山: 米特尔家族高层与帝国商业势力的掌权者之一，在帝都主持商会事务，掌握广泛的商路、拍卖和情报渠道。
    纳兰桀: 加玛帝国狮心元帅，纳兰家族的核心人物，兼具军方威望与贵族影响力，参与帝国高层事务。
  NPC速览:
    木辰: 木家家主，帝国军方与贵族体系中的重要人物，在帝都处理家族、军政和高层势力往来。
    木战: 木家年轻一代的重要成员，常随木家参与帝都贵族、军方和修炼者之间的事务。
    夭夜: 加玛皇室长公主，具备修炼天赋和政治判断力，经常代表皇室参与帝都高层事务。
    夭月: 加玛皇室公主，炼药天赋出众，与炼药师公会及帝都炼药师圈子保持联系。
    柳翎: 炼药师公会年轻炼药师，出身炼药师家族，在帝都公会修习并参与炼药师活动。
  层级上限: 帝都日常可接触到斗皇级强者；炼药师体系通常以六品炼药师为最高层级。
