---
地区-魔兽山脉:
  定位: 加玛帝国西部的自然区域，纵贯加玛西部，连接青山镇、帝国西部与塔戈尔大沙漠方向
  格局: 山脉外围连接青山镇等人类聚落，深处为魔兽领地，核心区域由高阶魔兽占据；人类活动沿进山路线向外围延伸
  结构: 以魔兽领地划分地盘，由下至上依次为外围、深处与高阶领地；人类以佣兵团、采药队和商队形式渗透外围，深处无固定管理
  主要势力:
    佣兵团与采药队: 活跃于山脉外围，负责采集药材、猎取魔核和护送进山队伍
    高阶魔兽: 六阶魔兽长期占据山脉核心领地，以气息与威压维持地盘
  地区规则: 外围允许采集与猎取，但魔兽领地、高阶巢穴和未标记区域不可擅入；深入越界等同于挑衅领主
  资源: 药材、魔核、魔兽材料、隐蔽洞府中的古代遗存，以及高阶魔兽巢穴中的稀有晶体与伴生资源
  风险: 低阶魔兽袭击、方向迷失、领地越界、高阶魔兽威压，以及佣兵与采药队之间的争夺
  原著机缘:
    隐蔽洞府: 藏有妖火残图、紫云翼、七彩毒经、玄高斗技狂狮吟；小医仙发现的洞府，位于山脉内部，入口隐蔽
    紫晶翼狮王巢穴: 藏有伴生紫晶源与紫灵晶，由六阶紫晶翼狮王及其幼崽占据
  地点:
    青山镇: 山脉外围的佣兵小镇，进山采药、护送与补给的前沿集散地
    魂断涧: 分隔外围与内部的天然深渊，通行困难，没有飞行或其他跨越手段通常需要绕行
    紫晶翼狮王巢穴: 山脉深处六阶魔兽领地，存在高价值火属性晶体与伴生资源
    隐蔽洞府与遗迹: 山壁、地下洞穴和封闭谷地中的古代修炼者遗存与稀有药材
