---
势力-云岚宗:
  位置: 帝都城外云岚山
  概览: 由云破天创立，历三百余年，帝国明面第一势力; 云韵接任宗主，维持正派形象; 前宗主云山暗中投靠魂殿
  环境: 东方风格，飞檐斗拱，主殿依山势层叠，外门区在山腰，内门与长老院在山顶; 后山隐藏有魂殿分殿，云山与鹜护法驻守
  结构:
    - 宗主(斗皇)
    - 长老(斗王)，三位
    - 内门弟子、执事(大斗师~斗灵)，共数百人
    - 外门弟子(斗者~斗师)，共数百人
  核心资源:
    - 风属性功法体系，玄阶高级《风之极·陨杀》为最高传承
    - 种植中低阶药材，最高五品
    - 数位四品炼药师，六品丹王古河驻宗
  特色: 以风属性斗气为主，强调速度与身法
  关系: 与加玛皇室关系猜疑，炼药师公会交好
  重要人物:
    云韵: 宗主，五星斗皇
    纳兰嫣然: 云韵亲传弟子，宗内大师姐
    云棱: 大长老，五星斗王，掌管内门晋升与惩戒
    云山: 前宗主，一星斗宗，长期闭关，魂殿隐线
    古河: 六品炼药师，丹王，三星斗皇，因私交留驻
    鹜鹰: 魂殿护法，三星斗宗，加玛帝国魂殿代理人
