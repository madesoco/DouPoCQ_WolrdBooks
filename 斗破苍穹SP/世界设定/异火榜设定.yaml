---
异火规则:
  - 异火由天地孕育，部分异火可随岁月产生灵智
  - 异火之间存在排斥，多种异火共存于同一体内需特殊功法、秘法或极强实力维系
  - 异火榜共二十三种，具体排名、特征与持有者以异火榜设定为准
异火榜:
  一·帝炎: 无固定色泽，由二十二种异火融合而成，焰色随融合来源流转。可统御同源异火本源，使其退散归伏。
  二·虚无吞炎: 黑色，无形无相，近乎不可寻觅与触碰。可吞噬有形物质与能量，并将其纳入火焰本源，所噬之物通常不留灰烬。魂族持有。
  三·净莲妖火: 乳白色，极度浓郁时呈粉红色，常显莲状。可净化接触到的肉体、灵魂与斗气，并能形成梦魇天雾，使目标陷入幻境。封印于妖火空间。
  四·金帝焚天炎: 金色，焰心可透赤红。可燃烧斗气，传说火势极盛时能焚毁斗圣所创空间。古族传承。
  五·生灵之焱: 绿色，如液体般流动，伴有淡青雾气，充满生命气息。可催生药材种子、温养草木与低阶生灵，亦会化作药材扎根于泥土中。药族持有。
  六·八荒破灭焱: 淡黑色，凝形时可如尖锥垂坠，亦可化作庞大火焰双翼。火势霸烈，能焚烧空间壁障，并在命中处留下难以消散的焦黑塌陷痕迹。炎族传承。
  七·九幽金祖火: 金色，焰尾可拖曳灰黑烟丝。焰中夹带九幽阴气，能随创口渗入，使伤势持续恶化。炎族炎烬持有。
  八·红莲业火: 深红色，焰心泛黑，火苗升腾时形成红莲状。可吸纳杀意与残戮之念壮大火势，灵智偏执，易反噬心性失控者。
  九·三千焱炎火: 紫黑色，极度浓郁时呈纯黑色，凝形时如游龙。成形于星空，可吸收星辰之力壮大并恢复，火势持久。封印于丹塔星域。
  十·九幽风炎: 黑色，诞生于极阴深渊，成形于猛烈风罡中。燃烧时伴有奇异风声，可依托气流传导、引起情绪波动并卷起大范围风暴。
  十一·骨灵冷火: 森白色，兼具极寒与极热。仅在每百年一次的日月交替之时，于极寒极阴之地出现。药尘持有。
  十二·九龙雷罡火: 银色，焰中有九条银色火龙穿梭，燃烧时伴有低沉龙吟。火焰夹带雷罡，可震慑灵魂并以电弧麻痹目标。焚炎谷传承。
  十三·龟灵地火: 褐色，形如巨龟，甲壳布满火刺，巨口生有刀锋般獠牙。可化作火壳附于体表，偏于防御与承受攻击。
  十四·陨落心炎: 透明无色，源自天降陨石所携火苗。炼化后可持续产生心火，淬炼斗气，并可召唤心火焚烧目标，对灵魂体有克制作用。封印于迦南学院内院天焚炼气塔下。
  十五·海心焰: 深蓝色，焰形起伏如浪，存在于大海中，可与水相融。遇水不熄，在水域中可借水势扩张火焰范围。韩枫持有。
  十六·火云水炎: 天蓝色，形如火云，亦可呈火水交融之态。蕴含水之力，可在燃烧与水态间迅速转换。炎族火耀持有。
  十七·火山石焰: 暗红色，焰中悬浮熔岩碎块。石粒可蓄热后脱焰射出，命中处附着火种并持续燃烧。炎族炎烬持有。
  十八·风雷怒焱: 深黄色，诞生于风、雷、火三种能量交接之处，兼具火焰的爆发、雷霆的麻痹与风势的迅疾。
  十九·青莲地心火: 诞生于地心熔岩，莲心孕有青色火焰，亦称青莲火。可引动地脉火气，使地火积蓄并爆发。
  二十·幽冥毒火: 初成时淡紫色，大成后偏绿，如鬼火般游曳于毒瘴中。火焰含有剧毒，可腐蚀经脉并随斗气流转扩散，极难吞噬融合。
  二十一·阴阳双炎: 黑白双色火焰相互缠绕，如阴阳双鱼游动。具生命与死亡双重力量，阳火可疗伤生肌，阴火可侵蚀筋骨。
  二十二·万兽灵火: 红色，火焰中隐现万兽之形与兽吼。由万兽之魂与万兽血脉凝结而成，可短时激发魔兽血脉、强化肉身，但过后易陷入乏力。
  二十三·玄黄炎: 深黄色，焰体沉稳不飘动。可潜移默化改变气运，并削弱突破瓶颈时所受劫难的强度。
