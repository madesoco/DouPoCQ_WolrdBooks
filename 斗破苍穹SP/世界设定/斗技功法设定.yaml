---
技能生成体系:
  体系目的:
    - 统一生成和记录角色拥有的功法、斗技、秘法与特殊能力
    - 所有能力使用同一格式，不建立技能点、技能槽、MP、冷却或伤害倍率

  能力分类:
    功法: 长期运转斗气或特殊力量的修炼法门，决定修炼方式、斗气属性与功法特性
    斗技: 运用斗气、灵魂力或肉身施展的招式，包括攻击、防御、身法、控制与辅助技法
    秘法: 通过特殊运转方式发动的爆发、强化、封印、转化或其他非常规技法
    特殊能力: 血脉、体质、异火、灵魂天赋、契约或其他来源赋予的能力

  阶位划分:
    黄阶: 以自身斗气和肉身为主的基础运用
    玄阶: 斗气能够离体成形，并形成较完整的招式效果
    地阶: 以自身斗气牵引天地能量，形成大范围或高强度效果
    天阶: 引发强烈天地共鸣，形成足以改变局部战局的效果

  通用生成格式:
    <能力名称>:
      类型: 斗技/功法/秘法/特殊能力
      标签: "[等阶或来源][主动/被动][力量属性][作用对象或方式][核心作用][特有机制...]"
      描述: 能力的来源、原理、运转方式与表现
      效果:
        <效果名称>: 该效果的实际作用

  标签写法:
    - 等阶或来源(必写): 功法、斗技及有明确阶位的秘法写完整阶位，如[玄阶高级]；无阶位能力写其来源，如[血脉]、[体质]、[异火]、[灵魂天赋]或[契约]
    - 发动方式(必写): 至少写[主动]或[被动]之一；兼具两者时可同时写
    - 力量属性(按实际): 写能力使用的属性或力量，如[火属性]、[雷属性]、[毒属性]、[灵魂力]或[肉身]
    - 作用对象或方式(按实际): 写作用对象、范围或施展方式，如[自身]、[单体]、[范围]、[环境]、[近身]或[远程]
    - 核心作用(必写): 概括能力的主要用途，如[修炼]、[攻击]、[防御]、[身法]、[控制]、[辅助]、[强化]或[感知]
    - 特有机制(按实际，可多个): 写最能区分该能力的机制，如[暗劲]、[吞噬异火]、[蓄力]、[持续]或[炼药]
    - 标签按上述顺序连续书写；示例词不是固定枚举，可按能力内容生成其他准确标签

  生成要求:
    - 每项能力必须完整生成名称、类型、标签、描述与效果
    - 效果每行只写一条“效果名: 实际效果”，效果名称由能力内容决定
    - 不增加其他固定字段；同一角色可以记录多种功法和能力

  分类写法:
    功法: 描述修炼和运转方式；效果写功法带来的修炼、斗气或能力变化
    斗技: 描述招式的施展过程与表现；效果写招式产生的具体作用
    秘法: 描述秘法的发动原理与变化；效果写发动后获得的具体变化
    特殊能力: 描述能力来源与表现；效果写该能力能够做到什么
