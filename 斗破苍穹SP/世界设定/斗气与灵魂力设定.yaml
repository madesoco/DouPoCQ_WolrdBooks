灵魂力量体系:
  规则:
    - 等级分未入境 → 凡境 → 灵境 → 天境 → 帝境；原作常以大成或大圆满描述具体积累，不强行统一细分
    - 高阶炼药需要相应灵魂强度；长期炼药可锻炼灵魂，但不必然提前突破下一境界
    - 斗气境界决定主要战斗层级；灵魂境界主要影响感知、炼药、灵魂斗技与灵魂抗性，二者并非一一对应
  凡境:
    总述: 灵魂力可用于感知、炼药与辅助战斗，尚未发生本质蜕变
    突破: 常人出生未入境;经冥想与炼药磨砺可入此境
  灵境:
    总述: 灵魂力发生质变，感知与操控能力大幅提升；通常是炼制八品丹药的重要基础
    突破: 凡境积累至极限后可尝试突破，灵魂本源或天材地宝可作为助力，但并非唯一途径
  天境:
    总述: 灵魂力量极强，可显著提升感知、炼药与灵魂斗技；通常是炼制九品丹药的基础
    突破: 灵境积累圆满后，借助机缘、修炼或纯净灵魂本源等途径突破
  帝境:
    总述: 极为罕见的至高灵魂境界，对低阶灵魂具有压倒性优势；仍受肉身状态、灵魂斗技与外力影响
    突破: 天境大圆满后方可尝试，通常需极大机缘或特殊修炼条件，天墓之魂仅为特定机缘之一

---
魔兽成长体系:
  规则:
    - 魔兽阶位表示血脉成长层次与通常上限，不等同于个体的实时战力
    - 实际实力按对应斗气境界比较；血脉、年龄、伤势、秘法与天赋均可使个体表现高于或低于同阶常态
    - 魔兽通常肉身强横、寿命较长，高等血脉者可越阶而战；化形不作为实力判定依据
    - 七阶及以上通常可化为人形；六阶及以下可借化形丹、化形草或特殊血脉等条件化形
  对应阶数与斗气等级:
    一阶·斗者: 处于低阶血脉成长层次
    二阶·斗师: 实力与血脉进一步成长
    三阶·大斗师: 已属寻常魔兽中的中上层
    四阶·斗灵: 体魄与斗气均较低阶魔兽强盛
    五阶·斗王: 通常已具不弱于人类的灵智
    六阶·斗皇: 属于高阶魔兽；可借化形丹等外物彻底化为人形
    七阶·斗宗: 灵智不逊于人类，通常可化为人形
    八阶·斗尊: 属极少见的高阶魔兽，通常已能维持人形
    九阶·斗圣: 为原著常见魔兽阶位的最高层次
    十阶·斗帝: 对非原著通行的常规阶位，仅作为血脉成长的理论上限