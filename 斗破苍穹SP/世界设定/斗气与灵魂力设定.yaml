---
斗气等级体系:
  规则:
    - 正式十阶：斗者 → 斗师 → 大斗师 → 斗灵 → 斗王 → 斗皇 → 斗宗 → 斗尊 → 斗圣 → 斗帝
    - 过渡阶段：斗之气、九转斗尊、半圣，不计入正式十阶
    - 半圣可分初级、中级、高级；斗圣分一至九星，三星以下为低阶，四至六星为中阶，七至八星为高阶，九星为巅峰
  表现特征:
    斗之气(x段): 一至九段，斗气滋养肉身，尚不能自由离体外放，是修炼的入门阶段
    斗者: 凝聚斗之气旋，能够初步调动斗气施展斗技
    斗师: 斗气可化为纱衣覆体，攻防能力显著提升
    大斗师: 斗气化铠，斗气运用更加凝实，可施展更强斗技
    斗灵: 斗气铠甲与外放能力进一步提升，在地方势力中已属中坚
    斗王: 可凝聚斗气双翼飞行，具备跨越复杂地形的能力
    斗皇: 斗气双翼更为凝实，飞行与斗气外放能力远胜低阶，是偏远地区少见的强者
    斗宗: 初步掌握空间之力，可踏空而行，并以空间手段限制或撕裂局部空间
    斗尊: 对空间之力掌控更深，可进行空间穿梭；构建稳定空间通道需视修为、秘法与条件而定
    九转斗尊: 斗尊巅峰将斗气九次压缩、凝练的过渡修行，九转后可冲击半圣
    半圣: 半步踏入圣境，空间之力与斗气均远强于斗尊；通常极难被低境界正面抗衡
    斗圣: 可开辟和掌控空间，初步触及天地法则；高星斗圣可进行更远距离的空间挪移
    斗帝: 突破大陆规则桎梏，诞生斗帝血脉，可穿越位面；近万年来大陆未有新的斗帝现世

