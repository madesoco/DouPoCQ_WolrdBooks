---
世界架构:
  大千世界: 无数位面聚合的宇宙总体，各具独立空间法则与生态; 虚空隔绝，非斗帝不可肉身横渡
  虚空: 位面夹层混沌空间，空间乱流密布; 斗宗之下触及即亡
  斗气大陆: 大千世界下位面，以斗气为力量根基
  主要种族: 人族（含远古八族：萧/古/魂/药/炎/雷/石/灵）、魔兽一族
  特殊存在: 灵魂体、天地之灵（如异火灵智）

修炼法则与特殊设定:
  斗气: 修习功法自天地汲取、凝于体内的能量; 战力与生存根基
  灵魂力: 感知、意识与生命气息的统合精神能量，居于识海
  异火: 天地能量自然孕育的奇焰，各具灵智与独有属性; 异火互斥，常人仅能容纳一种，强者可借特殊功法或秘法兼容多种
  血脉: 远古八族与部分魔兽族群的先天传承，浓度随代际衰减; 斗帝可令本族血脉升华，福泽全族

基础制度:
  文明形态: 冷兵器结合斗气应用; 斗气铭刻、阵法、炼丹替代机械科技，无热武器与蒸汽电力
  经济体系: 金币流通于平民，水晶卡为商会背书的大额凭证; 丹药、魔核、药材、功法斗技卷轴为硬通货; 契约以势力威慑与信誉维持，违约招致追杀、商路封禁或势力报复
  权力结构: 实力决定权柄; 国家存于边陲，强大宗门常凌驾其上
  交通与储物: 常规依赖畜力与步行; 斗王以上可御空，斗宗踏空而行，斗尊构建空间虫洞，传送阵造价高昂仅大势力持有; 纳戒价格不菲，斗者、佣兵、炼药师等有财力的修行者普遍佩戴，平民与底层斗者多用不起
  知识传承: 功法、斗技、炼丹术由家族、宗门、行会内部秘传; 高阶知识以卷轴封存，势力严管
  信仰体系: 尊血脉、奉师门、崇宗族，无建制宗教

历史与纪年:
  纪年法: 以萧炎出生为炎历元年；出生前纪为炎历前N年，出生后为炎历N年；月日按十二个月计
  时间轴:
    炎历前五万年以上（远古纪）: 斗气修炼体系成形，天地能量充沛，多位斗帝并存开辟独立空间，后裔承袭斗帝血脉
    炎历前五万年（斗帝纪元开端）: 大陆斗帝尽数消失，飞升通道封印，天地能量衰减，斗帝血脉逐渐枯竭
    炎历前万年（陀舍时代）: 陀舍古帝以异火证道，为大陆末代斗帝，随后消失，遗留古帝洞府，钥匙为八块陀舍古帝玉；陀舍之后无人再破帝境
    炎历前千年（八族时期）: 远古种族仅余八支，萧族遭魂族算计血脉衰败，残部迁至加玛帝国，魂天帝着手搜集古玉
    炎历15年（当前）: 萧炎被未婚妻纳兰嫣然退婚，立三年之约，故事开端；中州格局一殿一塔二宗三谷四方阁；远古八族隐世，仅遣年轻一代入世历练；丹塔凭炼药师资源居超然位置；魂殿（魂族下设）收集灵魂体活动趋频；陀舍古帝玉由八族暗中争夺
  特殊节律:
    中州丹会: 20年一届，上届炎历5年举办，冠军药尘
    药族丹典: 5年一届，仅族内或闻名炼药宗师参加
