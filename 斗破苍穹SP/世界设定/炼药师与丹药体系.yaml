---
炼药师体系:
  条件: 具备火、木双属性斗气，并有足够的灵魂感知力
  认定规则: 炼药师品级以其能够稳定炼制的最高丹药品级认定，不等同于斗气境界
  炼制因素:
    - 药材决定丹药药性与基础品质
    - 火焰用于提炼与融合药材；异火通常有利于控火、提纯与提高成功率
    - 灵魂力用于感知药材变化、掌控火候与凝丹，直接影响炼药能力
    - 药鼎用于聚火、控温与成丹，可提高炼制稳定性
  品级表现:
    一品: 能炼制基础丹药，主要服务小型家族、药铺与普通修炼者
    二品: 能稳定处理多种药材药性，可独立炼制常见低阶丹药
    三品: 能炼制较复杂的低阶丹药，在地方城市具备一定声望
    四品: 能处理多种药力冲突，可炼制中阶丹药，受到地方势力礼遇
    五品: 能炼制药性复杂、效果显著的中阶丹药，是一方势力的重要资源
    六品: 能炼制高阶丹药，受到国家、宗门与大型家族重视
    七品: 炼药大师，能炼制伴随丹雷的高阶丹药，数量稀少
    八品: 炼药宗师，通常具备灵境灵魂，能炼制具有较强灵性的丹药
    九品: 大陆顶级炼药师，通常具备天境灵魂，能炼制宝丹、玄丹与金丹
    帝品: 传说级炼药师，至少为帝境灵魂与斗帝实力，仅存于远古时期

丹药体系:
  基本规则:
    - 丹药品级表示丹方复杂度、药力上限与炼制难度；具体用途由丹方决定，同品丹药不代表相同效果
    - 药方决定功能与理论上限；药材品质决定基础药力；炼药师水平影响成丹率、纯度与副作用
    - 品级表现是大致边界，不是固定效果或绝对限制；具体丹药以自身丹方设定为准
    - 疗伤丹可加快恢复，不可无代价治愈重伤、根基破损或灵魂重创
    - 突破丹只能辅助积累、降低瓶颈，不可跳过必要修炼与境界条件
    - 增益丹有持续时间与负担，连续服用会产生抗药性、丹毒或根基不稳
  品级效果表现:
    一品: 基础止血、恢复体力，辅助低阶修炼
    二品: 小伤疗愈、斗气恢复、解除常见毒素
    三品: 较重外伤恢复、明显补充斗气，辅助低阶突破
    四品: 调理经脉、治疗内伤、解除顽固毒素
    五品: 恢复严重伤势、温养根基、强化体魄，辅助中阶突破
    六品: 处理高阶修炼者的严重伤势、经脉损伤和突破准备
    七品: 可影响斗宗至斗尊层次的修炼、伤势或状态，成丹通常伴随丹雷并具备初步灵性
    八品: 可影响斗尊、半圣层次的肉身、经脉或灵魂，丹药灵性较强，可能化为丹兽
    九品: 大陆顶级丹药，可影响斗圣层次，但仍受丹方、药材和服用者条件限制
    帝品: 传说级丹药，可涉及源气和完整灵智，不作为常规丹药
